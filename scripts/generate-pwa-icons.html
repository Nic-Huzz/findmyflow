<!DOCTYPE html>
<html>
<head>
<title>Generate PWA Icons</title>
<style>
body { margin: 40px; background: #1a1a2e; display: flex; gap: 40px; flex-wrap: wrap; }
canvas { border: 1px solid #333; }
.label { color: #fff; font-size: 14px; margin-bottom: 8px; font-family: sans-serif; }
.btn { margin-top: 10px; padding: 10px 20px; background: #5e17eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>

<div>
  <div class="label">512x512</div>
  <canvas id="c512" width="512" height="512"></canvas>
  <br><button class="btn" onclick="download('c512', 'icon-512.png')">Download 512</button>
</div>

<div>
  <div class="label">192x192</div>
  <canvas id="c192" width="192" height="192"></canvas>
  <br><button class="btn" onclick="download('c192', 'icon-192.png')">Download 192</button>
</div>

<script>
function drawIcon(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');

  // Background gradient (purple)
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#6b21eb');
  grad.addColorStop(0.5, '#5e17eb');
  grad.addColorStop(1, '#4a0ea8');
  ctx.fillStyle = grad;

  // Rounded rect (for maskable icon)
  const r = size * 0.18;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Text settings
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Gold gradient for text
  const textGrad = ctx.createLinearGradient(0, size * 0.3, 0, size * 0.75);
  textGrad.addColorStop(0, '#E9A23B');
  textGrad.addColorStop(1, '#f5c842');

  // Glow effect
  ctx.shadowColor = 'rgba(233, 162, 59, 0.3)';
  ctx.shadowBlur = size * 0.05;

  // "VIBE" text
  const fontSize = size * 0.22;
  ctx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = textGrad;
  ctx.fillText('VIBE', size / 2, size * 0.4);

  // "RISE" text
  ctx.fillText('RISE', size / 2, size * 0.63);

  // Reset shadow
  ctx.shadowBlur = 0;
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

drawIcon('c512', 512);
drawIcon('c192', 192);
</script>
</body>
</html>
