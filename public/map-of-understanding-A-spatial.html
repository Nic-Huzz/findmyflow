<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Understanding v2 — Spatial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #e0e0e0;
    height: 100vh;
    width: 100vw;
    cursor: grab;
  }
  body.grabbing { cursor: grabbing; }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,10,18,0.9) 0%, transparent 100%);
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, #5e17eb, #E9A23B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.3px;
  }
  .header .subtitle {
    font-size: 12px;
    color: #666;
    margin-top: 2px;
  }
  .controls {
    display: flex;
    gap: 8px;
    pointer-events: all;
  }
  .controls button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .controls button:hover {
    background: rgba(94,23,235,0.2);
    border-color: rgba(94,23,235,0.4);
    color: #fff;
  }

  .legend {
    position: fixed;
    bottom: 20px; left: 32px;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    pointer-events: none;
    background: rgba(10,10,18,0.85);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #888;
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* SVG connections */
  #connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Nodes */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    user-select: none;
  }
  .node:hover { z-index: 50; }

  .node-root {
    width: 200px;
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    background: radial-gradient(ellipse at center, rgba(94,23,235,0.3), rgba(233,162,59,0.15));
    border: 2px solid rgba(94,23,235,0.6);
    box-shadow: 0 0 60px rgba(94,23,235,0.3), 0 0 120px rgba(94,23,235,0.1);
    color: #fff;
  }
  .node-root:hover {
    box-shadow: 0 0 80px rgba(94,23,235,0.5), 0 0 160px rgba(94,23,235,0.2);
  }

  .node-branch {
    width: 180px;
    padding: 16px 18px;
    border-radius: 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    color: #e0e0e0;
  }
  .node-branch:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.25);
  }

  .node-leaf {
    max-width: 200px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 11px;
    line-height: 1.4;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    color: #999;
    font-style: italic;
  }
  .node-leaf:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
    color: #ccc;
  }
  .leaf-date {
    font-size: 9px;
    color: #555;
    margin-bottom: 4px;
    font-style: normal;
  }

  .node-branch .branch-icon {
    font-size: 22px;
    margin-bottom: 6px;
    display: block;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    max-width: 320px;
    padding: 16px;
    background: rgba(20,20,30,0.95);
    border: 1px solid rgba(94,23,235,0.3);
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #ccc;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-title {
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .tooltip .tt-entries {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .tooltip .tt-entry {
    margin-bottom: 4px;
  }
  .tooltip .tt-date {
    color: #666;
    font-size: 10px;
  }

  /* Format badge */
  .format-badge {
    position: fixed;
    top: 20px; right: 32px;
    background: rgba(94,23,235,0.15);
    border: 1px solid rgba(94,23,235,0.3);
    color: #a78bfa;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    z-index: 100;
    letter-spacing: 0.5px;
  }

  .mini-map {
    position: fixed;
    bottom: 20px;
    right: 32px;
    width: 160px;
    height: 100px;
    background: rgba(20,20,30,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    z-index: 100;
    overflow: hidden;
  }
  .mini-viewport {
    position: absolute;
    border: 1px solid rgba(94,23,235,0.5);
    background: rgba(94,23,235,0.1);
    border-radius: 2px;
  }
  .mini-dot {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    opacity: 0.6;
  }
</style>
</head>

// Render
const canvas = document.getElementById('canvas');
const svg = document.getElementById('connections');
const tooltip = document.getElementById('tooltip');

let scale = 0.85;
let panX = window.innerWidth / 2;
let panY = window.innerHeight / 2;
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let panStart = { x: 0, y: 0 };

function updateTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  svg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  updateMiniMap();
}

function createNode(data, className) {
  const el = document.createElement('div');
  el.className = `node ${className}`;
  el.style.left = data.x + 'px';
  el.style.top = data.y + 'px';
  el.dataset.id = data.id;
  return el;
}

// Draw root
const rootEl = createNode(MAP_DATA.root, 'node-root');
rootEl.textContent = 'We are vessels\nof experiences';
rootEl.style.whiteSpace = 'pre-line';
canvas.appendChild(rootEl);

// Draw branches and leaves
MAP_DATA.branches.forEach(branch => {
  // Branch node
  const bEl = createNode(branch, 'node-branch');
  bEl.style.borderColor = branch.color + '40';
  bEl.style.boxShadow = `0 0 20px ${branch.color}15`;
  bEl.innerHTML = `<span class="branch-icon">${branch.icon}</span>${branch.label.replace('\n', '<br>')}`;
  bEl.addEventListener('mouseenter', (e) => showTooltip(e, branch));
  bEl.addEventListener('mouseleave', hideTooltip);
  canvas.appendChild(bEl);

  // Connection: root -> branch
  drawConnection(0, 0, branch.x, branch.y, branch.color, 0.25);

  // Leaves
  branch.leaves.forEach(leaf => {
    const lEl = createNode(leaf, 'node-leaf');
    lEl.innerHTML = `<div class="leaf-date">${leaf.date}</div>${leaf.text}`;
    lEl.style.borderColor = branch.color + '20';
    canvas.appendChild(lEl);

    // Connection: branch -> leaf
    drawConnection(branch.x, branch.y, leaf.x, leaf.y, branch.color, 0.12);
  });
});

// Draw cross-connections (related ideas across branches)
const crossLinks = [
  ['safety', 'body', '#f87171'],      // safety <-> body
  ['essence', 'healing', '#4ade80'],   // love <-> healing
  ['culture', 'school', '#94a3b8'],    // culture <-> school
  ['healing', 'mission', '#E9A23B'],   // healing <-> mission
  ['safety', 'frequency', '#38bdf8'],  // safety <-> frequency
  ['school', 'essence', '#f472b6'],    // school broke essence
];
crossLinks.forEach(([fromId, toId, color]) => {
  const from = MAP_DATA.branches.find(b => b.id === fromId);
  const to = MAP_DATA.branches.find(b => b.id === toId);
  if (from && to) drawConnection(from.x, from.y, to.x, to.y, color, 0.06, true);
});

function drawConnection(x1, y1, x2, y2, color, opacity, dashed = false) {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  const cx1 = x1 + (mx - x1) * 0.5;
  const cy1 = y1;
  const cx2 = x2 - (x2 - mx) * 0.5;
  const cy2 = y2;
  line.setAttribute('d', `M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`);
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', color);
  line.setAttribute('stroke-opacity', opacity);
  line.setAttribute('stroke-width', dashed ? '1' : '1.5');
  if (dashed) line.setAttribute('stroke-dasharray', '6,4');
  svg.appendChild(line);
}

function showTooltip(e, branch) {
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `
    <div class="tt-title">${branch.icon} ${branch.label.replace('\n', ' ')}</div>
    <div>${branch.summary}</div>
    <div class="tt-entries">
      ${branch.leaves.slice(0, 3).map(l => `
        <div class="tt-entry"><span class="tt-date">${l.date}</span> ${l.text.substring(0, 80)}...</div>
      `).join('')}
    </div>
  `;
  tt.style.left = (e.clientX + 16) + 'px';
  tt.style.top = (e.clientY + 16) + 'px';
  tt.classList.add('visible');
}
function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// Pan & zoom
document.addEventListener('mousedown', (e) => {
  if (e.target.closest('.controls') || e.target.closest('.mini-map')) return;
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: panX, y: panY };
  document.body.classList.add('grabbing');
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = panStart.x + (e.clientX - dragStart.x);
  panY = panStart.y + (e.clientY - dragStart.y);
  updateTransform();
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  document.body.classList.remove('grabbing');
});
document.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(Math.max(scale * delta, 0.3), 2.5);
  // Zoom toward cursor
  const rect = canvas.getBoundingClientRect();
  panX = e.clientX - (e.clientX - panX) * (newScale / scale);
  panY = e.clientY - (e.clientY - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

function zoomIn() { scale = Math.min(scale * 1.2, 2.5); updateTransform(); }
function zoomOut() { scale = Math.max(scale * 0.8, 0.3); updateTransform(); }
function resetView() { scale = 0.85; panX = window.innerWidth/2; panY = window.innerHeight/2; updateTransform(); }

// Mini-map
function updateMiniMap() {
  const mm = document.getElementById('miniMap');
  const mmW = 160, mmH = 100;
  const worldMin = -800, worldMax = 800, worldH = 700;
  const sx = mmW / (worldMax - worldMin);
  const sy = mmH / (worldH * 2);

  let html = '';
  // Draw dots
  const allNodes = [MAP_DATA.root, ...MAP_DATA.branches];
  allNodes.forEach(n => {
    const dx = (n.x - worldMin) * sx;
    const dy = (n.y + worldH) * sy;
    const c = n.color || '#a78bfa';
    html += `<div class="mini-dot" style="left:${dx}px;top:${dy}px;background:${c}"></div>`;
  });

  // Viewport indicator
  const vpW = (window.innerWidth / scale) * sx;
  const vpH = (window.innerHeight / scale) * sy;
  const vpX = ((-panX / scale) - worldMin) * sx;
  const vpY = ((-panY / scale) + worldH) * sy;
  html += `<div class="mini-viewport" style="left:${vpX}px;top:${vpY}px;width:${vpW}px;height:${vpH}px"></div>`;

  mm.innerHTML = html;
}

updateTransform();
