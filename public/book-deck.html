<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Flow — Chapter Deck</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #08080f;
    color: #e0e0e0;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Navigation */
  .nav-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    background: rgba(8,8,15,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    z-index: 100;
  }
  .nav-title {
    font-size: 13px;
    font-weight: 600;
    color: #888;
  }
  .nav-title span {
    background: linear-gradient(135deg, #5e17eb, #E9A23B);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  .nav-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #888;
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:hover { background: rgba(94,23,235,0.2); color: #fff; border-color: rgba(94,23,235,0.3); }
  .nav-counter {
    font-size: 12px;
    color: #555;
    min-width: 60px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .section-pill {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 4px 12px;
    border-radius: 12px;
    font-weight: 600;
  }
  .section-crack { background: rgba(248,113,113,0.12); color: #f87171; }
  .section-flood { background: rgba(56,189,248,0.12); color: #38bdf8; }
  .section-diagonal { background: rgba(233,162,59,0.12); color: #E9A23B; }

  /* Slide container */
  .slides-wrapper {
    position: absolute;
    top: 56px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    opacity: 0;
    transform: translateX(60px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: all;
  }
  .slide.exit-left {
    opacity: 0;
    transform: translateX(-60px);
  }

  /* Slide layout */
  .slide-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 64px;
    max-width: 55%;
  }
  .slide-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 32px 48px;
    background: rgba(255,255,255,0.015);
    border-left: 1px solid rgba(255,255,255,0.04);
    overflow-y: auto;
  }

  /* Left side: chapter content */
  .ch-number {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #555;
    margin-bottom: 12px;
  }
  .ch-title {
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 24px;
    color: #f0f0f0;
  }
  .ch-epigraph {
    font-family: 'Crimson Pro', serif;
    font-size: 18px;
    font-style: italic;
    line-height: 1.6;
    color: #999;
    margin-bottom: 8px;
    padding-left: 20px;
    border-left: 2px solid rgba(94,23,235,0.3);
  }
  .ch-epigraph-date {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: #444;
    padding-left: 20px;
    margin-bottom: 32px;
    font-style: normal;
  }
  .ch-description {
    font-size: 16px;
    line-height: 1.7;
    color: #bbb;
    margin-bottom: 24px;
  }
  .ch-screenshot-line {
    font-size: 15px;
    font-weight: 600;
    color: #e0e0e0;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(94,23,235,0.08), rgba(233,162,59,0.05));
    border: 1px solid rgba(94,23,235,0.15);
    border-radius: 12px;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .ch-image-concept {
    font-size: 12px;
    color: #555;
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .ch-image-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #444;
    margin-bottom: 6px;
    font-weight: 600;
  }

  /* Right side: raw material */
  .raw-section {
    margin-bottom: 28px;
  }
  .raw-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #555;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .raw-entry {
    font-size: 13px;
    line-height: 1.55;
    color: #999;
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.04);
    margin-bottom: 8px;
    border-left: 3px solid var(--branch-color, rgba(94,23,235,0.3));
  }
  .raw-entry .entry-date {
    font-size: 10px;
    color: #444;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .raw-entry.proto-ip {
    background: rgba(94,23,235,0.04);
    border-left-color: #5e17eb;
  }
  .proto-badge {
    display: inline-block;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a78bfa;
    background: rgba(94,23,235,0.15);
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .branch-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 8px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .branch-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .connects-list {
    list-style: none;
  }
  .connects-list li {
    font-size: 12px;
    color: #777;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    line-height: 1.4;
  }
  .connects-list li strong {
    color: #aaa;
  }

  /* Story skeleton */
  .skeleton-section {
    margin-bottom: 28px;
  }
  .skeleton-beats {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .beat {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.04);
    transition: all 0.2s;
  }
  .beat:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
  }
  .beat-marker {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }
  .beat-scene .beat-marker { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .beat-tension .beat-marker { background: rgba(248,113,113,0.15); color: #f87171; }
  .beat-turn .beat-marker { background: rgba(233,162,59,0.15); color: #E9A23B; }
  .beat-land .beat-marker { background: rgba(74,222,128,0.15); color: #4ade80; }
  .beat-content {
    flex: 1;
    min-width: 0;
  }
  .beat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .beat-scene .beat-label { color: #a78bfa; }
  .beat-tension .beat-label { color: #f87171; }
  .beat-turn .beat-label { color: #E9A23B; }
  .beat-land .beat-label { color: #4ade80; }
  .beat-voice {
    font-size: 10px;
    color: #555;
    font-style: italic;
    margin-bottom: 3px;
  }
  .beat-text {
    font-size: 12px;
    color: #999;
    line-height: 1.45;
  }
  .beat-5c {
    font-size: 9px;
    color: #444;
    margin-top: 3px;
  }

  .skeleton-legend {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.015);
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .skeleton-legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    color: #555;
  }
  .skeleton-legend-dot {
    width: 6px; height: 6px;
    border-radius: 2px;
  }

  /* Title slide */
  .title-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px;
  }
  .title-slide .book-title {
    font-size: clamp(48px, 7vw, 80px);
    font-weight: 900;
    background: linear-gradient(135deg, #5e17eb 0%, #a78bfa 40%, #E9A23B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
    line-height: 1.05;
  }
  .title-slide .book-subtitle {
    font-size: 18px;
    color: #666;
    margin-bottom: 40px;
    font-weight: 400;
  }
  .title-slide .book-meta {
    font-size: 12px;
    color: #444;
    line-height: 2;
  }
  .title-slide .book-concept {
    font-size: 16px;
    font-style: italic;
    color: #888;
    margin-bottom: 32px;
    font-family: 'Crimson Pro', serif;
  }

  /* Section divider slide */
  .section-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px;
  }
  .section-slide .section-number {
    font-size: 120px;
    font-weight: 900;
    opacity: 0.06;
    position: absolute;
  }
  .section-slide .section-name {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 800;
    margin-bottom: 16px;
    color: #f0f0f0;
  }
  .section-slide .section-question {
    font-size: 18px;
    font-style: italic;
    color: #888;
    font-family: 'Crimson Pro', serif;
    max-width: 500px;
    line-height: 1.6;
  }
  .section-slide .section-chapters {
    font-size: 12px;
    color: #444;
    margin-top: 24px;
  }

  /* Progress bar */
  .progress-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.03);
    z-index: 100;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #5e17eb, #E9A23B);
    transition: width 0.4s ease;
  }

  /* Keyboard hint */
  .key-hint {
    position: fixed;
    bottom: 16px; right: 32px;
    font-size: 10px;
    color: #333;
    z-index: 100;
  }
  .key-hint kbd {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
  }

  /* Chapter list overlay */
  .ch-list-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(8,8,15,0.95);
    backdrop-filter: blur(20px);
    z-index: 200;
    display: none;
    overflow-y: auto;
    padding: 80px 40px;
  }
  .ch-list-overlay.visible { display: block; }
  .ch-list-overlay h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #e0e0e0;
  }
  .ch-list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .ch-list-item {
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ch-list-item:hover {
    background: rgba(94,23,235,0.1);
    border-color: rgba(94,23,235,0.2);
  }
  .ch-list-item .cli-num { font-size: 10px; color: #555; }
  .ch-list-item .cli-title { font-size: 13px; color: #ccc; font-weight: 600; margin-top: 2px; }
  .ch-list-close {
    position: fixed;
    top: 24px; right: 32px;
    background: none;
    border: none;
    color: #888;
    font-size: 24px;
    cursor: pointer;
    z-index: 201;
  }

  /* Framework reference slide */
  .framework-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    text-align: center;
    max-width: 900px;
    margin: 0 auto;
  }
  .framework-slide h2 {
    font-size: 24px;
    font-weight: 800;
    color: #e0e0e0;
    margin-bottom: 32px;
  }
  .fw-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    width: 100%;
    margin-bottom: 32px;
  }
  .fw-col {
    text-align: left;
  }
  .fw-col-header {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #555;
    margin-bottom: 12px;
    font-weight: 600;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .fw-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .fw-dot {
    width: 8px; height: 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .fw-label { color: #ccc; font-weight: 600; }
  .fw-desc { color: #777; font-size: 11px; margin-top: 2px; }
  .fw-arrow {
    color: #444;
    font-size: 16px;
    margin: 0 4px;
  }
  .fw-mapping {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  .fw-mapping th {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #555;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-weight: 600;
  }
  .fw-mapping td {
    font-size: 12px;
    color: #999;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    vertical-align: top;
  }
  .fw-mapping td:first-child { color: #ccc; font-weight: 600; }
  .fw-mapping .fw-voice { color: #555; font-style: italic; font-size: 11px; }
</style>
</head>

// Navigation
let current = 0;
const total = SLIDES.length;

function updateUI() {
  document.getElementById('counter').textContent = `${current + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((current + 1) / total) * 100}%`;

  const section = SLIDES[current].section;
  const pill = document.getElementById('sectionPill');
  pill.className = 'section-pill';
  if (section === 'crack') { pill.classList.add('section-crack'); pill.textContent = 'THE CRACK'; }
  else if (section === 'flood') { pill.classList.add('section-flood'); pill.textContent = 'THE FLOOD'; }
  else if (section === 'diagonal') { pill.classList.add('section-diagonal'); pill.textContent = 'THE DIAGONAL'; }
  else { pill.textContent = ''; pill.style.display = 'none'; }
  if (section !== 'intro') pill.style.display = '';
}

function goToSlide(n) {
  if (n < 0 || n >= total || n === current) return;
  const prev = document.querySelector('.slide.active');
  const next = wrapper.children[n];
  if (prev) { prev.classList.remove('active'); prev.classList.add('exit-left'); setTimeout(() => prev.classList.remove('exit-left'), 500); }
  next.classList.add('active');
  current = n;
  updateUI();
}

function nextSlide() { goToSlide(current + 1); }
function prevSlide() { goToSlide(current - 1); }

function showChapterList() { document.getElementById('chapterList').classList.add('visible'); }
function hideChapterList() { document.getElementById('chapterList').classList.remove('visible'); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  if (e.key === 'Escape') {
    const list = document.getElementById('chapterList');
    if (list.classList.contains('visible')) hideChapterList();
    else showChapterList();
  }
});

updateUI();
