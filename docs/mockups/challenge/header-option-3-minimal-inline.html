<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Option 3 — Minimal Inline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 40px 16px; }
  .phone { width: 390px; background: #f8f9fa; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }

  .header {
    background: linear-gradient(135deg, #5e17eb 0%, #8b5cf6 100%);
    color: white;
    padding: 2.5rem 1.5rem 1.25rem;
    border-radius: 0 0 24px 24px;
    text-align: center;
  }

  /* Top row: streak + title + settings */
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .top-badge {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    min-width: 44px;
    justify-content: center;
  }

  .top-badge:hover { background: rgba(255,255,255,0.25); }

  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
  }

  /* Single score row — total prominent, categories inline */
  .score-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 1rem;
  }

  .total-block {
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
    padding-right: 1rem;
    border-right: 1px solid rgba(255,255,255,0.2);
    margin-right: 1rem;
  }

  .total-value {
    font-size: 2.25rem;
    font-weight: 800;
    line-height: 1;
  }

  .total-unit {
    font-size: 0.6rem;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .categories-inline {
    display: flex;
    gap: 0.75rem;
  }

  .cat-item {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .cat-item .emoji { font-size: 0.8rem; }
  .cat-item.healing .val { color: #6ee7b7; }
  .cat-item.playlist .val { color: #fbbf24; }
  .cat-item.bonus .val { color: #93c5fd; }

  /* Leaderboard bar */
  .leaderboard-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }

  .leaderboard-bar:hover { background: rgba(255,255,255,0.18); }

  .content { padding: 1.5rem; min-height: 200px; }
  .content p { color: #888; text-align: center; margin-top: 2rem; }
  .label { display: block; text-align: center; margin-bottom: 12px; font-size: 0.85rem; color: #666; font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="top-row">
      <div class="top-badge">🔥 0</div>
      <h1>Gamify Your Ambitions</h1>
      <div class="top-badge">⚙️</div>
    </div>

    <div class="score-row">
      <div class="total-block">
        <span class="total-value">45</span>
        <span class="total-unit">pts</span>
      </div>
      <div class="categories-inline">
        <div class="cat-item healing">
          <span class="emoji">💚</span>
          <span class="val">30</span>
        </div>
        <div class="cat-item playlist">
          <span class="emoji">🎮</span>
          <span class="val">7</span>
        </div>
        <div class="cat-item bonus">
          <span class="emoji">⭐</span>
          <span class="val">0</span>
        </div>
      </div>
    </div>

    <div class="leaderboard-bar">
      🏆 Leaderboard
    </div>
  </div>

  <div class="content">
    <span class="label">Option 3 — Minimal Inline</span>
    <p>Everything on fewer lines. Streak & settings flanking the title.<br>Total + categories on one row. Shortest header possible.</p>
  </div>
</div>
</body>
</html>
