<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option A: Clean Card Stack</title>
<style>
  /*
   * OPTION A: Clean Card Stack
   *
   * Philosophy: Separate concerns. Header is white with clear hierarchy.
   * Analytics is a dark hero card. Each section is its own white card below.
   * Matches the /me page and Sales page patterns exactly.
   *
   * Pros: Consistent with rest of app, scannable, each section breathes
   * Cons: More vertical scroll, analytics feels less "special"
   */

  :root {
    --brand-purple: #5e17eb;
    --brand-gold: #E9A23B;
    --text-primary: #1a1a2e;
    --text-secondary: #6c757d;
    --text-muted: #adb5bd;
    --surface: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, rgba(94,23,235,0.04) 0%, #fafafa 25%, #fafafa 75%, rgba(233,162,59,0.04) 100%);
    min-height: 100vh;
    padding: 20px;
    padding-bottom: 100px;
    color: var(--text-primary);
  }

  .container { max-width: 500px; margin: 0 auto; }

  /* === TOOLBAR === */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    margin-bottom: 16px;
  }

  .toolbar-back {
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--brand-purple);
    cursor: pointer;
    padding: 8px;
    margin: -8px;
  }

  .toolbar-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }

  .toolbar-close {
    width: 36px;
    height: 36px;
    background: #f8f9fa;
    border: none;
    border-radius: 12px;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* === ACTION BAR (below title) === */
  .action-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .action-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid #e9ecef;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .action-chip.active {
    background: rgba(94, 23, 235, 0.06);
    border-color: rgba(94, 23, 235, 0.15);
    color: var(--brand-purple);
  }

  .action-chip.gold {
    background: linear-gradient(135deg, var(--brand-gold), #f5c55a);
    border: none;
    color: var(--text-primary);
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(233, 162, 59, 0.25);
  }

  /* === HERO ANALYTICS CARD === */
  .analytics-hero {
    background: linear-gradient(135deg, var(--brand-purple) 0%, #7c3aed 50%, #4c1d95 100%);
    border-radius: 24px;
    padding: 28px 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(94, 23, 235, 0.3);
    color: white;
  }

  .analytics-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -20px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(233, 162, 59, 0.2) 0%, transparent 70%);
    pointer-events: none;
  }

  .analytics-hero::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -30px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(94, 23, 235, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .analytics-hero > * { position: relative; z-index: 1; }

  .hero-eyebrow {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 16px;
  }

  /* === PERIOD TABS (inside hero) === */
  .period-tabs {
    display: flex;
    gap: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .period-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .period-tab.active {
    background: rgba(255, 255, 255, 0.15);
    color: white;
  }

  /* === STATS GRID === */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .stat-card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }

  .stat-card.gold {
    background: rgba(233, 162, 59, 0.12);
    border-color: rgba(233, 162, 59, 0.25);
  }

  .stat-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: white;
  }

  .stat-card.gold .stat-value {
    color: #fbbf24;
  }

  .stat-value .unit {
    font-size: 14px;
    font-weight: 500;
    opacity: 0.6;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 4px;
  }

  .stat-trend {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    margin-top: 6px;
  }

  .stat-trend.up { color: #22c55e; background: rgba(34, 197, 94, 0.15); }
  .stat-trend.down { color: #ef4444; background: rgba(239, 68, 68, 0.15); }

  /* === WHITE CONTENT CARDS === */
  .content-card {
    background: var(--surface);
    border: 1px solid #e9ecef;
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
  }

  .card-eyebrow {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--brand-purple);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-eyebrow-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--brand-purple), #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* === DEVICE BREAKDOWN === */
  .device-row {
    display: flex;
    gap: 16px;
  }

  .device-item {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: #f8f9fa;
    border-radius: 14px;
  }

  .device-icon { font-size: 24px; }

  .device-info .device-count {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-primary);
  }

  .device-info .device-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  /* === DROP-OFF FUNNEL === */
  .funnel-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .funnel-step {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-secondary);
    width: 28px;
  }

  .funnel-bar-track {
    flex: 1;
    height: 10px;
    background: #f0f0f0;
    border-radius: 5px;
    overflow: hidden;
  }

  .funnel-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ef4444, #f97316);
    border-radius: 5px;
  }

  .funnel-count {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    width: 50px;
    text-align: right;
  }

  /* === TAB SWITCHER === */
  .tab-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .tab-btn {
    padding: 10px 20px;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--brand-purple), #7c3aed);
    border-color: transparent;
    color: white;
    box-shadow: 0 4px 12px rgba(94, 23, 235, 0.3);
  }

  .tab-btn.gold {
    background: linear-gradient(135deg, var(--brand-gold), #f5c55a);
    border-color: transparent;
    color: var(--text-primary);
    font-weight: 800;
    margin-left: auto;
    box-shadow: 0 4px 12px rgba(233, 162, 59, 0.3);
  }

  /* === LABEL === */
  .mockup-label {
    text-align: center;
    padding: 12px;
    background: var(--brand-purple);
    color: white;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 12px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="mockup-label">Option A: Clean Card Stack</div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="toolbar-back">&larr;</button>
    <span class="toolbar-title">Responses</span>
    <button class="toolbar-close">&times;</button>
  </div>

  <!-- Flow name + actions as chips -->
  <h2 style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 12px;">
    Validation: Conscious leaders under-earn a...
  </h2>

  <div class="action-bar">
    <label class="action-chip active">
      <input type="checkbox" checked style="width:14px; height:14px; accent-color: #5e17eb;"> In-progress
    </label>
    <button class="action-chip gold">Export CSV</button>
  </div>

  <!-- Analytics Hero Card (dark) -->
  <div class="analytics-hero">
    <div class="hero-eyebrow">Analytics</div>

    <div class="period-tabs">
      <button class="period-tab">7 days</button>
      <button class="period-tab active">30 days</button>
      <button class="period-tab">All time</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">12</div>
        <div class="stat-label">Started</div>
        <div class="stat-trend up">+3</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-value">8</div>
        <div class="stat-label">Completed</div>
        <div class="stat-trend up">+2</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">67%</div>
        <div class="stat-label">Completion</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">3.2 <span class="unit">min</span></div>
        <div class="stat-label">Avg. Time</div>
      </div>
    </div>
  </div>

  <!-- Device Breakdown (white card) -->
  <div class="content-card">
    <div class="card-eyebrow">
      <span class="card-eyebrow-icon">📱</span>
      Devices
    </div>
    <div class="device-row">
      <div class="device-item">
        <span class="device-icon">📱</span>
        <div class="device-info">
          <div class="device-count">6</div>
          <div class="device-label">Mobile</div>
        </div>
      </div>
      <div class="device-item">
        <span class="device-icon">💻</span>
        <div class="device-info">
          <div class="device-count">6</div>
          <div class="device-label">Desktop</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Drop-off (white card) -->
  <div class="content-card">
    <div class="card-eyebrow">
      <span class="card-eyebrow-icon">📉</span>
      Drop-off Points
    </div>
    <div class="funnel-item">
      <span class="funnel-step">Q1</span>
      <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width: 25%"></div></div>
      <span class="funnel-count">1 left</span>
    </div>
    <div class="funnel-item">
      <span class="funnel-step">Q3</span>
      <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width: 50%"></div></div>
      <span class="funnel-count">2 left</span>
    </div>
    <div class="funnel-item">
      <span class="funnel-step">Q5</span>
      <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width: 25%"></div></div>
      <span class="funnel-count">1 left</span>
    </div>
  </div>

  <!-- Tab Switcher -->
  <div class="tab-row">
    <button class="tab-btn active">Overview</button>
    <button class="tab-btn">Deep Dive</button>
    <button class="tab-btn gold">All Answers</button>
  </div>

  <!-- Placeholder content -->
  <div class="content-card" style="min-height: 120px; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
    Timeline chart, funnel viz, geo breakdown...
  </div>
</div>

</body>
</html>
