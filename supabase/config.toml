# Supabase Configuration for FindMyFlow
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://findmyflow.nichuzz.com"
additional_redirect_urls = ["http://localhost:5173", "https://findmyflow.nichuzz.com"]

[auth.email]
enable_confirmations = true

# MCP server uses custom API key auth (fmf_k1_*), not Supabase JWT.
# Must deploy with --no-verify-jwt so the Bearer header reaches our auth.ts.
[functions.mcp-server]
verify_jwt = false

# Called internally by mcp-server for validation_responses analysis.
# Auth is handled by the calling function (service role key).
[functions.analyze-validation-responses]
verify_jwt = false

# Cron-triggered: auto-scores league matchups every 15 minutes.
# No user JWT — called by pg_cron with service role key.
[functions.score-league-matchups]
verify_jwt = false
