  <body>
    <!-- Splash Screen -->
    <style>
      @keyframes splashFadeIn {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #6b21eb 0%, #5e17eb 50%, #4a0ea8 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      #splash-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        animation: splashFadeIn 0.5s ease-out;
      }
      #splash-logo span {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffdd27;
        line-height: 1.1;
        text-shadow: 0 0 30px rgba(255, 221, 39, 0.3);
      }
      #splash-logo .word-vibe {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 2px;
      }
      #splash-logo .word-rise {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 2px;
      }
      #splash-loader {
        margin-top: 40px;
        display: flex;
        gap: 8px;
      }
      #splash-loader span {
        width: 8px;
        height: 8px;
        background: rgba(255, 221, 39, 0.6);
        border-radius: 50%;
        animation: splashPulse 1.2s ease-in-out infinite;
      }
      #splash-loader span:nth-child(2) { animation-delay: 0.2s; }
      #splash-loader span:nth-child(3) { animation-delay: 0.4s; }
    </style>
    <div id="splash-screen">
      <div id="splash-logo">
        <span class="word-vibe">VIBE</span>
        <span class="word-rise">RISE</span>
      </div>
      <div id="splash-loader">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash screen once React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() {
              splash.style.display = 'none';
            }, 300);
          }
        }, 500);
      });
    </script>
  </body>
