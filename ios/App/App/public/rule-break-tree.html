    ['media-1991','media-2004'],['media-2004','media-2007'],['media-2007','media-2018'],
    ['media-2018','media-2022'],

    ['b-nourishment','food-1730'],['food-1730','food-1810'],['food-1810','food-1834'],
    ['food-1834','food-1876'],['food-1876','food-1948'],['food-1948','food-1968'],
    ['food-1968','food-1994'],['food-1994','food-2002'],['food-2002','food-2013'],

    ['b-bonds','comms-1775'],['comms-1775','comms-1844'],['comms-1844','comms-1876'],
    ['comms-1876','comms-1901'],['comms-1901','comms-1971'],['comms-1971','comms-1983'],
    ['comms-1983','comms-1992'],['comms-1992','comms-2009'],['comms-2009','comms-2020'],

    ['b-healing','med-1867'],['med-1867','med-1882'],['med-1882','med-1928'],
    ['med-1928','med-1952'],['med-1952','med-1955'],['med-1955','med-2003'],
    ['med-2003','med-2015'],['med-2015','med-2020'],

    ['b-status','fashion-1852'],['fashion-1852','fashion-1858'],['fashion-1858','fashion-1916'],
    ['fashion-1916','fashion-1975'],['fashion-1975','fashion-2013'],['fashion-2013','fashion-2021'],

    ['b-shelter','property-1885'],['property-1885','property-1908'],['property-1908','property-1947'],
    ['property-1947','property-2008'],['property-2008','property-2011'],['property-2011','property-2021'],

    ['b-threat','defense-1617'],['defense-1617','defense-1688'],['defense-1688','defense-1945'],
    ['defense-1945','defense-1968'],['defense-1968','defense-1988'],['defense-1988','defense-2001'],
    ['defense-2001','defense-2017'],
  ]

  // Cross-industry merges (only for mapped branches)
  const mergeLinks = [
    { from: 'energy-1991', to: 'car-2008',  label: 'Battery tech\nenables Tesla' },
    { from: 'tech-2007',   to: 'car-2010',  label: 'Smartphone\nenables Uber' },
    { from: 'ai-2016',     to: 'car-2020',  label: 'Computer vision\nenables Waymo' },
    // Story merges
    { from: 'energy-1893', to: 'media-1920', label: 'AC power grid\nenables broadcast' },
    { from: 'tech-1991',   to: 'media-1991', label: 'Same event:\nWeb = new story' },
    { from: 'tech-1991',   to: 'media-2007', label: 'Broadband web\nenables streaming' },
    { from: 'tech-2007',   to: 'media-2018', label: 'Smartphone\nenables TikTok' },
    { from: 'ai-2022',     to: 'media-2022', label: 'ChatGPT enables\nAI content' },
    // Tech ↔ Media merge
    { from: 'tech-2004',   to: 'media-2004', label: 'Platform infra\nenables social' },
    // Energy ↔ Tech merge
    { from: 'tech-2006',   to: 'energy-2017', label: 'Cloud + software\nmanage grid' },
    // Food merges
    { from: 'energy-1776', to: 'food-1834',  label: 'Steam power\nmechanises farms' },
    { from: 'energy-1776', to: 'food-1876',  label: 'Steam compressors\nenable cold chain' },
    { from: 'tech-2007',   to: 'food-2013',  label: 'Smartphone\nenables delivery' },
    // Comms merges
    { from: 'tech-1971',   to: 'comms-1983',  label: 'Microprocessor\nenables mobile' },
    { from: 'tech-1991',   to: 'comms-1971',  label: 'Internet\nscales email' },
    { from: 'tech-2007',   to: 'comms-2009',  label: 'Smartphone\nenables WhatsApp' },
    { from: 'tech-2006',   to: 'comms-2020',  label: 'Cloud infra\nenables Zoom' },
    // Medicine merges
    { from: 'tech-1975',   to: 'med-2003',   label: 'Computing power\nmaps genome' },
    { from: 'tech-1998',   to: 'med-2020',   label: 'Genomic computing\naccelerates mRNA' },
    { from: 'car-1956',    to: 'food-1948',  label: 'Highway system\nenables fast food' },
    // Status merges
    { from: 'media-1895',  to: 'fashion-1916', label: 'Hollywood creates\nbeauty culture' },
    { from: 'media-2004',  to: 'fashion-2013', label: 'Social media\ncreates influencers' },
    { from: 'tech-2006',   to: 'fashion-2021', label: 'Cloud platforms\nenable creators' },
    // Shelter merges
    { from: 'car-1913',    to: 'property-1947', label: 'Assembly line\nthinking → suburbs' },
    { from: 'tech-2007',   to: 'property-2008', label: 'Smartphone\nenables Airbnb' },
    { from: 'tech-2007',   to: 'property-2011', label: 'IoT + smartphone\n→ smart home' },
    // Threat merges
    { from: 'ai-2012',     to: 'defense-2017',  label: 'Deep learning\nenables AI surveillance' },
    { from: 'tech-2007',   to: 'med-2015',   label: 'Smartphone\nenables telehealth' },
  ]

  // ═══════════════════════════════════════════
  //  LAYOUT
  // ═══════════════════════════════════════════

  const container = document.getElementById('tree-container')
  const W = container.clientWidth, H = container.clientHeight
  const cx = W / 2, cy = H / 2
  const maxR = Math.min(W, H) * 0.44
  const PRIMAL_R = 70, BRIDGE_R = 120
  // Piecewise scale: pre-1850 compressed (Story's early nodes), post-1850 expanded (modern industry)
  const yearScale = d3.scaleLinear()
    .domain([1400, 1850, 2030])
    .range([BRIDGE_R + 35, BRIDGE_R + 75, maxR])

  const nodeMap = {}
  const origin = { id: 'origin', x: cx, y: cy, type: 'origin', label: 'Human\nExperience' }
  nodeMap['origin'] = origin

  PRIMALS.forEach(p => {
    p.x = cx + Math.cos(p.angle) * PRIMAL_R
    p.y = cy + Math.sin(p.angle) * PRIMAL_R
    nodeMap[p.id] = p
  })

  bridges.forEach(b => {
    const angle = PRIMALS.find(p => p.id === b.primal).angle
    b.x = cx + Math.cos(angle) * BRIDGE_R
    b.y = cy + Math.sin(angle) * BRIDGE_R
    b.angle = angle
    nodeMap[b.id] = b
  })

  // Position industry nodes: year = radius, branch = angle, then push overlaps apart
  industryNodes.forEach(n => {
    const ind = INDUSTRIES[n.branch]
    if (!ind) return
    const siblings = industryNodes.filter(m => m.branch === n.branch)
    const idx = siblings.indexOf(n)
    const spread = Math.min(0.08, 1.0 / Math.max(siblings.length - 1, 1))
    const totalSpread = (siblings.length - 1) * spread
    n.angle = ind.baseAngle - totalSpread / 2 + idx * spread
    n.r = yearScale(n.year)
    n.x = cx + Math.cos(n.angle) * n.r
    n.y = cy + Math.sin(n.angle) * n.r
    n.industry = n.branch
    nodeMap[n.id] = n
  })

  // Push apart overlapping nodes within each branch (20 passes for thorough separation)
  Object.keys(INDUSTRIES).forEach(branchKey => {
    const siblings = industryNodes.filter(m => m.branch === branchKey)
    for (let pass = 0; pass < 20; pass++) {
      for (let i = 1; i < siblings.length; i++) {
        const a = siblings[i - 1], b = siblings[i]
        const dx = b.x - a.x, dy = b.y - a.y
        const dist = Math.sqrt(dx * dx + dy * dy)
        if (dist < 32) {
          const nudge = 0.02
          a.angle -= nudge
          b.angle += nudge
          a.x = cx + Math.cos(a.angle) * a.r
          a.y = cy + Math.sin(a.angle) * a.r
          b.x = cx + Math.cos(b.angle) * b.r
          b.y = cy + Math.sin(b.angle) * b.r
        }
      }
    }
  })

  // ═══════════════════════════════════════════
  //  FILTERS
  // ═══════════════════════════════════════════

  const allBranches = new Set()
  Object.keys(INDUSTRIES).forEach(k => allBranches.add(k))
  PRIMALS.filter(p => !p.extended).forEach(p => allBranches.add(p.id))
  const activeBranches = new Set(allBranches)

  const filtersEl = document.getElementById('filters')

  const allBtn = document.createElement('button')
  allBtn.className = 'filter-pill filter-all active'
  allBtn.textContent = 'All'
  allBtn.addEventListener('click', () => {
    const allActive = activeBranches.size === allBranches.size
    if (allActive) {
      activeBranches.clear()
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'))
    } else {
      allBranches.forEach(b => activeBranches.add(b))
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.add('active'))
    }
    allBtn.classList.toggle('active', !allActive)
    updateVisibility()
  })
  filtersEl.appendChild(allBtn)

  const PILL_CONFIG = [
    { id: 'cars',   label: 'Cars',     color: '#7c3aed' },
    { id: 'tech',   label: 'Tech',     color: '#00b4d8' },
    { id: 'ai',     label: 'AI',       color: '#ec4899' },
    { id: 'energy', label: 'Energy',   color: '#f59e0b' },
    { id: 'media',  label: 'Story',    color: '#fb923c' },
    { id: 'food',   label: 'Food',     color: '#22c55e' },
    { id: 'comms',  label: 'Comms',    color: '#f472b6' },
    { id: 'medicine', label: 'Medicine', color: '#a78bfa' },
    { id: 'fashion',     label: 'Status',      color: '#e879f9' },
    { id: 'property',    label: 'Shelter',      color: '#38bdf8' },
    { id: 'defense',     label: 'Threat',       color: '#ef4444' },
  ]

  PILL_CONFIG.forEach(cfg => {
    const btn = document.createElement('button')
    btn.className = `filter-pill active${cfg.stub ? ' stub' : ''}`
    btn.textContent = cfg.label
    btn.dataset.branch = cfg.id
    btn.style.borderColor = cfg.color
    btn.style.background = cfg.color + '25'
    btn.addEventListener('click', () => {
      const isActive = activeBranches.has(cfg.id)
      if (isActive) activeBranches.delete(cfg.id); else activeBranches.add(cfg.id)
      btn.classList.toggle('active', !isActive)
      btn.style.background = !isActive ? cfg.color + '25' : 'transparent'
      allBtn.classList.toggle('active', activeBranches.size === allBranches.size)
      updateVisibility()
    })
    filtersEl.appendChild(btn)
  })

  // ═══════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════

  const svg = d3.select('#tree-container').append('svg').attr('width', W).attr('height', H)
  const g = svg.append('g')

  const zoomBehavior = d3.zoom().scaleExtent([0.3, 10]).on('zoom', e => g.attr('transform', e.transform))
  svg.call(zoomBehavior)

  document.getElementById('zoom-in').addEventListener('click', () =>
    svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.6))
  document.getElementById('zoom-out').addEventListener('click', () =>
    svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.625))
  document.getElementById('zoom-fit').addEventListener('click', () =>
    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity))

  // Stars
  for (let i = 0; i < 120; i++) {
    g.append('circle')
      .attr('cx', cx + (Math.random() - 0.5) * W * 1.5)
      .attr('cy', cy + (Math.random() - 0.5) * H * 1.5)
      .attr('r', Math.random() * 1 + 0.2)
      .attr('fill', `rgba(255,255,255,${Math.random() * 0.10 + 0.02})`)
  }

  // Origin glow
  g.append('circle').attr('class','origin-glow').attr('cx',cx).attr('cy',cy).attr('r',32).attr('fill','rgba(94,23,235,0.08)')
  g.append('circle').attr('class','origin-glow').attr('cx',cx).attr('cy',cy).attr('r',50).attr('fill','rgba(233,162,59,0.03)').style('animation-delay','-2s')

  // Rings
  g.append('circle').attr('class','primal-ring').attr('cx',cx).attr('cy',cy).attr('r',PRIMAL_R)
  ;[1500,1800,1880,1920,1960,2000].forEach(yr => {
    const r = yearScale(yr)
    g.append('circle').attr('class','decade-ring').attr('cx',cx).attr('cy',cy).attr('r',r)
    g.append('text').attr('class','decade-label').attr('x',cx).attr('y',cy - r + 12).text(yr)
  })

  // Origin → primal lines
  PRIMALS.forEach(p => {
    g.append('line').attr('class','branch-line')
      .attr('x1',cx).attr('y1',cy).attr('x2',p.x).attr('y2',p.y)
      .attr('stroke',p.color).attr('opacity',0.25).attr('data-primal',p.id)
  })

  // Primal → bridge lines
  bridges.forEach(b => {
    const p = nodeMap[b.primal]
    g.append('line').attr('class','branch-line')
      .attr('x1',p.x).attr('y1',p.y).attr('x2',b.x).attr('y2',b.y)
      .attr('stroke',b.color).attr('opacity',0.25).attr('data-primal',b.primal)
  })

  // Branch lines
  branchLinks.forEach(([sId, tId]) => {
    const s = nodeMap[sId], t = nodeMap[tId]
    if (!s || !t) return
    const branch = t.branch || t.industry
    const col = INDUSTRIES[branch]?.color || '#888'
    const mx = (s.x+t.x)/2, my = (s.y+t.y)/2, dx = t.x-s.x, dy = t.y-s.y
    g.append('path').attr('class','branch-line')
      .attr('d', `M${s.x},${s.y} Q${mx+dy*0.05},${my-dx*0.05} ${t.x},${t.y}`)
      .attr('stroke',col).attr('opacity',0.45).attr('data-branch',branch)
  })

  // Merge lines
  mergeLinks.forEach(ml => {
    const s = nodeMap[ml.from], t = nodeMap[ml.to]
    if (!s || !t) return
    const mx = (s.x+t.x)/2, my = (s.y+t.y)/2
    const cpx = mx + (cx-mx)*0.35, cpy = my + (cy-my)*0.35
    g.append('path').attr('class','merge-line')
      .attr('d', `M${s.x},${s.y} Q${cpx},${cpy} ${t.x},${t.y}`)
      .attr('stroke','#E9A23B').attr('data-merge',`${ml.from}__${ml.to}`)
    const lx = (s.x+2*cpx+t.x)/4, ly = (s.y+2*cpy+t.y)/4
    const lines = ml.label.split('\n'), lh = 10, bgH = lines.length*lh+5
    g.append('rect').attr('class','merge-label-bg')
      .attr('x',lx-46).attr('y',ly-bgH/2).attr('width',92).attr('height',bgH).attr('rx',3)
      .attr('data-merge',`${ml.from}__${ml.to}`)
    lines.forEach((line,i) => {
      g.append('text').attr('class','merge-label-text')
        .attr('x',lx).attr('y',ly-bgH/2+9+i*lh).text(line)
        .attr('data-merge',`${ml.from}__${ml.to}`)
    })
  })

  // Industry labels
  Object.entries(INDUSTRIES).forEach(([key, ind]) => {
    const nodes = industryNodes.filter(n => n.branch === key)
    const spread = Math.min(0.06, 0.7 / Math.max(nodes.length-1, 1))
    const midAngle = ind.baseAngle
    g.append('text').attr('class','industry-label')
      .attr('x', cx + Math.cos(midAngle) * (maxR + 28))
      .attr('y', cy + Math.sin(midAngle) * (maxR + 28))
      .attr('fill',ind.color).text(ind.label).attr('data-branch',key)
  })

  // ── Tooltip ──
  const tooltip = document.getElementById('tooltip')
  function showTip(d, evt) {
    let html = ''
    if (d.who) {
      const col = d.type === 'merge' ? '#E9A23B' : (INDUSTRIES[d.branch]?.color || '#fff')
      html = `<div class="tt-who" style="color:${col}">${d.who} &middot; ${d.year}</div>`
      html += `<div class="tt-rule"><b>The rule: </b>${d.assumption}</div>`
      html += `<div class="tt-break"><b>The break: </b>${d.ruleBreak}</div>`
      if (d.mergeWith) html += `<div class="tt-merge">&#9889; Merge: ${d.branch} &times; ${d.mergeWith}</div>`
      const sdTag = SD_TAGS[d.id]
      if (sdTag && SD_COLORS[sdTag]) html += `<div style="font-size:0.6rem;margin-top:0.35rem;padding-top:0.3rem;border-top:1px solid rgba(255,255,255,0.06)"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${SD_COLORS[sdTag]};margin-right:4px;vertical-align:middle"></span><span style="color:${SD_COLORS[sdTag]};font-weight:600;letter-spacing:0.5px">${SD_LABELS[sdTag] || sdTag}</span></div>`
    } else if (d.desc) {
      html = `<div class="tt-who" style="color:${d.color||'#fff'}">${(d.label||'').replace(/\n/g,' ')}</div>`
      html += `<div class="tt-desc">${d.desc}</div>`
    }
    if (!html) return
    tooltip.innerHTML = html; tooltip.classList.add('visible'); posTip(evt)
  }
  function posTip(e) {
    const r = container.getBoundingClientRect()
    let x = e.clientX-r.left+16, y = e.clientY-r.top-10
    if (x+310>r.width) x = e.clientX-r.left-316
    if (y+140>r.height) y -= 120; if (y<0) y = 10
    tooltip.style.left = x+'px'; tooltip.style.top = y+'px'
  }
  function hideTip() { tooltip.classList.remove('visible') }

  // ═══════════════════════════════════════════
  //  NODES
  // ═══════════════════════════════════════════

  // Origin
  const og = g.append('g').attr('class','node-group').attr('transform',`translate(${cx},${cy})`)
  og.append('circle').attr('class','origin-pulse').attr('r',22).attr('fill','rgba(255,255,255,0.08)')
  og.append('circle').attr('r',16).attr('fill','#0d0a1a').attr('stroke','rgba(255,255,255,0.5)').attr('stroke-width',2)
  og.append('circle').attr('r',5).attr('fill','rgba(255,255,255,0.85)')
  origin.label.split('\n').forEach((l,i) => {
    og.append('text').attr('class','node-label').attr('y',28+i*12).text(l)
  })

  // Primals
  PRIMALS.forEach(p => {
    const pg = g.append('g').attr('class','node-group')
      .attr('transform',`translate(${p.x},${p.y})`).attr('data-primal',p.id)
    if (p.extended) {
      pg.append('circle').attr('class','node-glow').attr('r',16).attr('fill',p.color)
      pg.append('circle').attr('r',10).attr('fill','#0d0a1a').attr('stroke',p.color).attr('stroke-width',2)
      pg.append('circle').attr('r',3.5).attr('fill',p.color).attr('opacity',0.6)
    } else {
      pg.append('circle').attr('class','stub-ring').attr('r',12).attr('stroke',p.color)
      pg.append('circle').attr('r',5).attr('fill','#0d0a1a').attr('stroke',p.color).attr('stroke-width',1.5).attr('opacity',0.5)
    }
    const lx = Math.cos(p.angle)*22, ly = Math.sin(p.angle)*22
    pg.append('text').attr('class','primal-label').attr('x',lx).attr('y',ly+4)
      .attr('fill',p.color).attr('opacity',p.extended?0.8:0.4).text(p.label)
    pg.on('mouseenter',e=>showTip(p,e)).on('mousemove',e=>posTip(e)).on('mouseleave',hideTip)
  })

  // Bridges
  bridges.forEach(b => {
    const bg = g.append('g').attr('class','node-group')
      .attr('transform',`translate(${b.x},${b.y})`).attr('data-primal',b.primal)
    bg.append('circle').attr('class','node-glow').attr('r',14).attr('fill',b.color)
    bg.append('circle').attr('r',7).attr('fill','#0d0a1a').attr('stroke',b.color).attr('stroke-width',1.5).attr('opacity',0.6)
    b.label.split('\n').forEach((l,i) => {
      bg.append('text').attr('class','bridge-label').attr('y',16+i*11).text(l)
    })
    bg.on('mouseenter',e=>showTip(b,e)).on('mousemove',e=>posTip(e)).on('mouseleave',hideTip)
  })

  // Industry nodes
  industryNodes.forEach(n => {
    const ind = INDUSTRIES[n.branch]
    if (!ind) return
    const isMerge = n.type === 'merge'
    const r = isMerge ? 8 : 6
    const ng = g.append('g').attr('class','node-group')
      .attr('transform',`translate(${n.x},${n.y})`).attr('data-branch',n.branch)
    ng.append('circle').attr('class','node-glow').attr('r',r+10).attr('fill',isMerge?'#E9A23B':ind.color)
    ng.append('circle').attr('class','node-circle').attr('r',r).attr('fill','#0d0a1a').attr('stroke',isMerge?'#E9A23B':ind.color)
    if (isMerge) ng.append('circle').attr('r',3).attr('fill','#E9A23B')
    ng.append('text').attr('class','node-year').attr('y',-(r+4)).text(n.year)
    n.label.split('\n').forEach((l,i) => {
      ng.append('text').attr('class','node-label').attr('y',r+13+i*11).text(l)
    })
    ng.on('mouseenter',e=>showTip(n,e)).on('mousemove',e=>posTip(e)).on('mouseleave',hideTip)
      .on('touchstart',e=>{e.preventDefault();showTip(n,e.touches[0])})
  })

  // ═══════════════════════════════════════════
  //  VISIBILITY
  // ═══════════════════════════════════════════

  function updateVisibility() {
    g.selectAll('[data-branch]').each(function() {
      d3.select(this).classed('hidden', !activeBranches.has(d3.select(this).attr('data-branch')))
    })
    g.selectAll('[data-primal]').each(function() {
      const el = d3.select(this), pid = el.attr('data-primal')
      const children = PRIMAL_INDUSTRIES[pid] || []
      const visible = children.length === 0
        ? activeBranches.has(pid)
        : children.some(ci => activeBranches.has(ci))
      el.classed('hidden', !visible)
    })
    mergeLinks.forEach(ml => {
      const fb = nodeMap[ml.from]?.branch || nodeMap[ml.from]?.industry
      const tb = nodeMap[ml.to]?.branch || nodeMap[ml.to]?.industry
      g.selectAll(`[data-merge="${ml.from}__${ml.to}"]`).classed('hidden', !(activeBranches.has(fb) && activeBranches.has(tb)))
    })
  }

  let resizeTimer
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(() => location.reload(), 400)
  })
  </script>
</body>
</html>
