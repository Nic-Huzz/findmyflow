<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="50%" stop-color="black" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Gradient overlay -->
  <rect width="1080" height="1080" fill="url(#g)"/>

  <!-- Headline -->
  <text x="540" y="820" text-anchor="middle" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="84" font-weight="900">Does work feel</text>
  <text x="380" y="920" text-anchor="middle" fill="#E9A23B" font-family="Inter,Helvetica,Arial,sans-serif" font-size="84" font-weight="900">heavy</text>
  <text x="640" y="920" text-anchor="start" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="84" font-weight="900">instead</text>
  <text x="540" y="1010" text-anchor="middle" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="84" font-weight="900">of <tspan fill="#E9A23B">fun?</tspan></text>

  <!-- Brand -->
  <text x="540" y="1060" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">FIND MY FLOW</text>
</svg>
