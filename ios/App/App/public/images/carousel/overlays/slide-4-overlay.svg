      <stop offset="0%" stop-color="black" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="black" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="black" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#g)"/>

  <!-- Tag -->
  <text x="70" y="830" fill="#E9A23B" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">STEP 2 — HEAD FULL OF DREAMS</text>

