<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E9A23B"/>
    </marker>
  </defs>

  <!-- Semi-transparent background -->
  <rect width="1080" height="1080" fill="rgba(0,0,0,0.55)"/>

  <!-- Title -->
  <text x="540" y="100" text-anchor="middle" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" font-style="italic">I've observed a pattern on the</text>
  <text x="540" y="155" text-anchor="middle" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" font-style="italic">path to finding fulfilment</text>

  <!-- Axes -->
  <line x1="140" y1="900" x2="140" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
  <line x1="140" y1="900" x2="960" y2="900" stroke="rgba(255,255,255,0.5)" stroke-width="4"/>
  <polygon points="140,200 132,220 148,220" fill="rgba(255,255,255,0.5)"/>
  <polygon points="960,900 940,892 940,908" fill="rgba(255,255,255,0.5)"/>

  <!-- Axis labels -->
  <text x="55" y="550" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" transform="rotate(-90,55,550)">ACTION</text>
  <text x="550" y="980" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="28" font-weight="700">SELF-KNOWLEDGE</text>

  <!-- Gold diagonal (faint) -->
  <line x1="190" y1="850" x2="910" y2="230" stroke="#E9A23B" stroke-width="4" opacity="0.2"/>

  <!-- Arrow 1: Up to Unfulfilment (top-left) -->
  <path d="M 200,830 Q 220,530 330,320" stroke="white" stroke-width="5" fill="none" marker-end="url(#arrowW)"/>

  <!-- UNFULFILMENT label -->
  <text x="360" y="270" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">UNFULFILMENT</text>
  <text x="360" y="305" fill="rgba(255,255,255,0.55)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="500">Busy but empty</text>

  <!-- Arrow 2: Down to Head Full of Dreams (bottom-right) -->
  <path d="M 420,330 Q 580,540 710,720" stroke="white" stroke-width="5" fill="none" marker-end="url(#arrowW)"/>

  <!-- HEAD FULL OF DREAMS label -->
  <text x="620" y="770" fill="white" font-family="Inter,Helvetica,Arial,sans-serif" font-size="32" font-weight="800">HEAD FULL OF DREAMS</text>
  <text x="620" y="805" fill="rgba(255,255,255,0.55)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="500">Aware but stuck</text>

  <!-- Arrow 3: Straight up to Self-Actualisation -->
  <line x1="760" y1="730" x2="760" y2="460" stroke="#E9A23B" stroke-width="5" marker-end="url(#arrowG)"/>

  <!-- SELF-ACTUALISATION label -->
  <text x="620" y="410" fill="#E9A23B" font-family="Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">SELF-ACTUALISATION</text>
  <text x="620" y="448" fill="rgba(233,162,59,0.7)" font-family="Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="500">Action meets self-knowledge</text>
</svg>
